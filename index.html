<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f0f0;
    }
    #game-container {
      position: relative;
      width: 600px;
      height: 400px;
      background-color: #000;
      overflow: hidden;
    }
    #scoreboard {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-size: 16px;
    }
    #restart-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 5px 10px;
      background-color: #ff0000;
      color: white;
      border: none;
      cursor: pointer;
    }
    #restart-btn:hover {
      background-color: #cc0000;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="scoreboard">
      Score: <span id="score">0</span> | High Score: <span id="high-score">0</span> | Level: <span id="level">1</span>
    </div>
    <button id="restart-btn">Restart Game</button>
    <canvas id="gameCanvas" width="600" height="400"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');
    const highScoreElement = document.getElementById('high-score');
    const levelElement = document.getElementById('level');
    const restartBtn = document.getElementById('restart-btn');

    let snake = [{ x: 200, y: 200 }];
    let direction = { x: 10, y: 0 };
    let food = { x: 300, y: 200 };
    let score = 0;
    let highScore = localStorage.getItem('highScore') || 0;
    let level = 1;
    const levelThreshold = 5; // Score required to advance to the next level
    const maxLevel = 10;

    const levels = [
      [], // Level 1: No obstacles
      [{ x: 150, y: 150 }, { x: 400, y: 300 }], // Level 2
      [{ x: 100, y: 100 }, { x: 500, y: 100 }, { x: 300, y: 300 }], // Level 3
      [{ x: 200, y: 200 }, { x: 400, y: 200 }, { x: 300, y: 100 }], // Level 4
      [{ x: 50, y: 50 }, { x: 550, y: 50 }, { x: 50, y: 350 }, { x: 550, y: 350 }], // Level 5
      [{ x: 150, y: 150 }, { x: 450, y: 150 }, { x: 150, y: 250 }, { x: 450, y: 250 }], // Level 6
      [{ x: 100, y: 200 }, { x: 500, y: 200 }, { x: 300, y: 50 }, { x: 300, y: 350 }], // Level 7
      [{ x: 200, y: 100 }, { x: 400, y: 100 }, { x: 200, y: 300 }, { x: 400, y: 300 }], // Level 8
      [{ x: 50, y: 200 }, { x: 550, y: 200 }, { x: 300, y: 50 }, { x: 300, y: 350 }, { x: 300, y: 200 }], // Level 9
      [{ x: 100, y: 100 }, { x: 500, y: 100 }, { x: 100, y: 300 }, { x: 500, y: 300 }, { x: 300, y: 200 }] // Level 10
    ];

    let obstacles = levels[level - 1];
    highScoreElement.textContent = highScore;

    function drawSnake() {
      ctx.fillStyle = 'lime';
      snake.forEach(segment => {
        ctx.fillRect(segment.x, segment.y, 10, 10);
      });
    }

    function drawFood() {
      ctx.fillStyle = 'red';
      ctx.fillRect(food.x, food.y, 10, 10);
    }

    function drawObstacles() {
      ctx.fillStyle = 'gray';
      obstacles.forEach(obstacle => {
        ctx.fillRect(obstacle.x, obstacle.y, 10, 10);
      });
    }

    function moveSnake() {
      const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreElement.textContent = score;
        if (score > highScore) {
          highScore = score;
          localStorage.setItem('highScore', highScore);
          highScoreElement.textContent = highScore;
        }
        generateFood();
        checkLevelUp();
      } else {
        snake.pop();
      }
    }

    function generateFood() {
      food.x = Math.floor(Math.random() * 60) * 10;
      food.y = Math.floor(Math.random() * 40) * 10;
    }

    function checkCollision() {
      const head = snake[0];

      // Check wall collision
      if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
        return true;
      }

      // Check self collision
      for (let i = 1; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
          return true;
        }
      }

      // Check obstacle collision
      for (let obstacle of obstacles) {
        if (head.x === obstacle.x && head.y === obstacle.y) {
          return true;
        }
      }

      return false;
    }

    function checkLevelUp() {
      if (score % levelThreshold === 0 && level < maxLevel) {
        level++;
        levelElement.textContent = level;
        obstacles = levels[level - 1];
      }
    }

    function gameLoop() {
      if (checkCollision()) {
        alert('Game Over! Your score: ' + score);
        resetGame();
        return;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawSnake();
      drawFood();
      drawObstacles();
      moveSnake();
    }

    function resetGame() {
      snake = [{ x: 200, y: 200 }];
      direction = { x: 10, y: 0 };
      score = 0;
      level = 1;
      scoreElement.textContent = score;
      levelElement.textContent = level;
      obstacles = levels[level - 1];
      generateFood();
    }

    document.addEventListener('keydown', (e) => {
      switch (e.key) {
        case 'ArrowUp':
          if (direction.y === 0) direction = { x: 0, y: -10 };
          break;
        case 'ArrowDown':
          if (direction.y === 0) direction = { x: 0, y: 10 };
          break;
        case 'ArrowLeft':
          if (direction.x === 0) direction = { x: -10, y: 0 };
          break;
        case 'ArrowRight':
          if (direction.x === 0) direction = { x: 10, y: 0 };
          break;
      }
    });

    restartBtn.addEventListener('click', resetGame);

    setInterval(gameLoop, 100);
  </script>
</body>
</html>
